services:

  api:
    build: .
    image: event-system
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: event-system
    command: python -m app.worker
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events_db
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5